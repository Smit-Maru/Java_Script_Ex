<!DOCTYPE html>
<html>
<head>
    <title>Page Load Example</title>
</head>

<body>

    <h1>Hello World</h1>

    <script>

        function displayMessage() {
            console.log("Function executed after page loadeddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd");
            alert("Page Loaded!");
        }

        window.addEventListener("load", displayMessage);

    </script>

</body>
</html>
