<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <input id="ip">

  <script>
    const ip = document.getElementById('ip');
    ip.addEventListener('blur',()=>{
      ip.value = ip.value.toUpperCase();
    })
  </script>
</body>
</html>
